[project]
name = "finbot"
dynamic = ["version"]
dependencies = [
    "aiohttp==3.14.3",
    "alembic==1.19.1",
    "bcrypt==5.0.0",
    "cachetools<8",
    "cffi==2.1.1",
    "cryptography==50.0.1",
    "fastapi[standard]<1",
    "gspread==6.2.1",
    "gunicorn==26.2.0",
    "jsonschema==4.26.0",
    "krakenex==2.2.2",
    "oauth2client==4.1.3",
    "orjson==3.12.0",
    "plaid-python==43.0.0",
    "playwright==1.62.0",
    "price-parser==0.5.1",
    "psycopg2==2.9.12",
    "pycoingecko==3.2.0",
    "pydantic==2.13.5",
    "python-binance==1.0.37",
    "python-gnupg==0.5.6",
    "python-jose[cryptography]<4",
    "requests==2.34.2",
    "sqlalchemy==2.0.52",
    "temporalio<2",
    "twilio==9.11.0",
    "uvicorn<1",
    "yfinance<2",
    "openai>=3",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio<2",
    "ruff==0.16.5",
    "semver==3.0.4",
    "sqlalchemy-stubs<1",
    "types-cachetools<8",
    "types-requests==2.33.0.20260712",
    "watchdog[watchmedo]<7",
]

[tool.ruff]
exclude = [
    'migrations/',
    'venv/',
    'webapp/'
]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "Q", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.dynamic]
version = {attr = "finbot._version.__version__"}
